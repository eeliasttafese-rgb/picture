*{box-sizing:border-box}

.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:8px auto}
button{font:inherit;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 14px;cursor:pointer}
button.on{border-color:var(--accent);background:var(--accent);color:#fff}
#tabs button{font-size:1.05rem}
.sw{width:52px;height:52px;border-radius:50%;padding:0;border:3px solid var(--line)}
.sw.on{border-color:var(--ink);transform:scale(1.15)}

svg,canvas{width:100%;height:auto;display:block}
canvas{touch-action:none;background:#fff;border-radius:10px}

.r{fill:#fff;stroke:#333;stroke-width:3;stroke-linejoin:round;cursor:pointer}
button{font-size:1.2rem}.big{display:block;width:100%;max-width:340px;font-size:1.8rem;padding:20px;margin:6px auto}.em{font-size:2rem;padding:6px 12px;line-height:1.2}

#msg{min-height:1.5em;font-size:1.05rem}
#hint{font-size:1.3rem;font-weight:bold;min-height:1.5em}
#win{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);align-items:center;justify-content:center;font-size:2rem;color:#fff;z-index:9;flex-direction:column;gap:8px;padding:20px}
